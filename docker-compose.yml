services:
  backend:
    image: nataliaflorezg/tierra-backend:v9
    container_name: tierra-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env

  frontend:
    image: nataliaflorezg/tierra-frontend:v11
    container_name: tierra-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    user: root # Truco para desarrollo local
    restart: on-failure

volumes:
  jenkins_data:
